services:
  web:
    build: { context: ., dockerfile: Dockerfile.dev }
    env_file: .env
    ports: ["127.0.0.1:8001:8000"]
    volumes: [".:/app"]
    depends_on: [db]
  db:
    image: postgres:18-alpine
    env_file: .env
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
volumes:
  pgdata:
