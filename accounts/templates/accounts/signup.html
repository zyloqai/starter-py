{% extends "accounts/base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<h2>Create account</h2>
<form method="post">{% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Sign up</button>
</form>
<p>Have an account? <a href="{% url 'login' %}">Sign in</a></p>
{% endblock %}
